{% extends "base.html" %}

{% block styles %}
<link href="{{ url_for('static', path='css/forgot_password.css') }}" rel="stylesheet">
{% endblock %}

{% block content %}
<main class="forgot-wrapper">
    <div class="forgot-grid">
        <!-- Coluna Esquerda: Título Editorial -->
        <section class="forgot-info">
            <a href="{{ url_for('home') }}" class="back-link">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                VOLTAR PARA ENTRAR
            </a>

            <h1 class="forgot-title">Redefinir<br>sua senha</h1>

            <p class="forgot-description">
                Escolha uma nova senha forte para proteger sua conta. Este link expirará após o uso.
            </p>
        </section>

        <!-- Coluna Direita: Card de Formulário -->
        <section class="forgot-card">
            <form id="reset-password-form">
                <div class="form-group">
                    <label for="new-password" class="form-label">NOVA SENHA</label>
                    <div class="input-wrapper">
                        <input type="password" id="new-password" name="new_password" placeholder="Mínimo de 8 caracteres" required minlength="8" style="padding-left: 1rem;">
                    </div>
                </div>

                <div class="form-group" style="margin-top: 1.25rem;">
                    <label for="confirm-password" class="form-label">CONFIRMAR NOVA SENHA</label>
                    <div class="input-wrapper">
                        <input type="password" id="confirm-password" name="confirm_password" placeholder="Repita a nova senha" required minlength="8" style="padding-left: 1rem;">
                    </div>
                </div>

                <button type="submit" id="submit-btn" class="btn-submit">
                    <span>SALVAR NOVA SENHA</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>

                <div id="feedback-message" class="feedback-message" aria-live="polite"></div>
            </form>
        </section>
    </div>
</main>

<script type="module" src="{{ url_for('static', path='js/reset_password.js') }}"></script>
{% endblock %}
