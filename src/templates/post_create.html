{% extends "base.html" %}

{% block title %}Criar publicação{% endblock %}

{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', path='css/post_create.css') }}">
{% endblock %}

{% block content %}
<section class="post-create">
  <div class="container">
    <div class="post-create__shell">
      <header class="post-create__top">
        <div>
          <span class="post-create__eyebrow">Nova publicação</span>
          <h1 class="post-create__title">Criar publicação</h1>
        </div>
        <span class="post-create__meta">Conte sua história</span>
      </header>

      <form class="post-form" method="post" action="#">
        <div class="post-form__grid">
          <div class="field field--full">
            <label for="title">Título</label>
            <input
              id="title"
              name="title"
              type="text"
              placeholder="Ex.: O impacto do design brutalista na web"
              required
            >
          </div>

          <div class="field">
            <label for="category">Categoria</label>
            <select id="category" name="category" required>
              <option value="">Selecione</option>
              <option value="Design">Design</option>
              <option value="Backend">Backend</option>
              <option value="Frontend">Frontend</option>
              <option value="Carreira">Carreira</option>
              <option value="Reflexão">Reflexão</option>
            </select>
          </div>

          <div class="field">
            <label for="reading_time_min">Tempo de leitura</label>
            <input
              id="reading_time_min"
              name="reading_time_min"
              type="number"
              min="1"
              max="60"
              value="5"
              required
            >
          </div>

          <div class="field field--full">
            <label for="content">Conteúdo</label>
            <textarea
              id="content"
              name="content"
              placeholder="Escreva o texto da sua publicação..."
              required
            ></textarea>
          </div>
        </div>

        <div class="post-form__actions">
          <span class="post-form__hint">Seu texto será salvo no modelo de post do projeto.</span>

          <div class="button-row">
            <a href="{{ url_for('homepost') }}" class="btn btn--ghost">Cancelar</a>
            <button type="submit" class="btn">Publicar</button>
          </div>
        </div>
      </form>
    </div>
  </div>
</section>
{% endblock %}
