{% extends "base.html" %}

{% block title %}{{ status_code }} | Algo deu errado{% endblock %}

{% block styles %}
  <link rel="stylesheet" href="{{ url_for('static', path='css/error.css') }}">
{% endblock %}

{% block content %}
<section class="error-page" aria-labelledby="error-title">
  <div class="error-card">
    <span class="error-code">Erro {{ status_code }}</span>
    <h1 id="error-title" class="error-title">Algo saiu do caminho por aqui.</h1>
    <p class="error-message">{{ message }}</p>

    <div class="error-actions">
      <a class="error-button primary" href="{{ url_for('home') }}">Voltar para a home</a>
      <a class="error-button secondary" href="{{ url_for('homepost') }}">Ver publicações</a>
    </div>
  </div>
</section>
{% endblock content %}
